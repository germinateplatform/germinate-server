title: Germinate Documentation
description: Open-source plant genetic resources database platform documentation.
baseurl: "germinate-server" # Leave empty if using a custom domain or user.github.io, otherwise "/your-repo-name"
url: "https://germinateplatform.github.io/germinate-server"     # Your GitHub Pages URL

markdown: kramdown
permalink: pretty
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    disable: false
    css_class: highlight

# Navigation items used in the header and landing page
user_pages:
  - title: User interface & Basics
    url: /user/ui/
    description: Use the Germinate UI, browse and search data, mark interesting items.
  - title: Germplasm & Passport Data
    url: /user/germplasm/
    description: Managing accessions, taxonomy, biological status, and geographic origins.
  - title: Phenotypic & Trial Data
    url: /user/phenotypes/
    description: Recording field trials, trait definitions, and observations metrics.
  - title: Genotypic & Marker Data
    url: /user/genotypes/
    description: Storing SNP matrices, genetic maps, alleles, and molecular marker datasets.
  - title: Environmental & Climate Data
    url: /user/environment/
    description: Managing environmental, climatic definitions, and measurement values.
  - title: Item Lists & Groups
    url: /user/lists-groups/
    description: Creating session lists and persistent groups.
  - title: Data Import & Templates
    url: /user/data-import/
    description: Using Germinate data templates, validation tools, and BrAPI integration.

admin_pages:
  - title: Setup Instructions
    url: /admin/setup/
    description: Create and host your own instance of Germinate using Docker.
  - title: Setup Example
    url: /admin/example-setup/
    description: An example configuration for Germinate and Gatekeeper.
  - title: Germinate Configuration
    url: /admin/configuration/
    description: All configuration options for Germinate.
  - title: Germinate Settings Page
    url: /admin/settings/
    description: Germinate's user interface for making changes.
  - title: Migration Information
    url: /admin/migration/
    description: Any manual changes that need to be made between Germinate version updates.
  - title: Germinate Command Line
    url: /admin/cli/
    description: How to use the command line tools bundled with Germinate.
  - title: Frequently Asked Questions
    url: /admin/faq/
    description: Answers to a list of questions that we often get about Germinate.

